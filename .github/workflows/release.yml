name: release scheduled episodes

on:
  schedule:
    - cron: "7 * * * *"      # hourly at :07 UTC; GitHub may run it a few minutes late
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate feeds
        run: python tools/release.py
      - name: Commit and push if anything became visible
        id: commit
        run: |
          git config user.name "release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to commit"
          else
            git commit -m "Release scheduled episodes $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Ask Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
